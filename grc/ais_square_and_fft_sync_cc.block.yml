id: ais_square_and_fft_sync
label: square_and_fft_sync_cc
category: '[ais]'

templates:
  imports: from gnuradio import ais
  make: ais.square_and_fft_sync_cc(${rate}, ${sps}, ${fftlen})

parameters:
- id: rate
  label: Sample rate
  dtype: float
- id: sps
  label: Symbols per second
  dtype: float
- id: fftlen
  label: FFT length
  dtype: int

inputs:
- label: in
  dtype: complex

outputs:
- label: out
  dtype: complex

file_format: 1
